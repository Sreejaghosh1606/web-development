<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    First name:<br>
    <input type="text" name="fname"> <br>
    <br>
    Middle name:<br>
    <input type="text" name="mname"> <br>
    Last name:<br>
    <input type="text" name="lname" required> <br>

    Email id: <br>
    <input type="email" name="email" id="email"><br>

    Password:<br>
    <input type="password" name="password" id="password"><br>

    Mobile number<br>
    <input type="tel" name="tel" id="tel"><br>

    DOB:<br>
    <input type="date" name="dob" id="dob"><br>

    Gender:<br>
    <input type="radio" name="gender" id="gender" value="male">Male
    <input type="radio" name="gender" id="gender" value="female">Female
    <input type="radio" name="gender" id="gender" value="others">Others

    Language:<br>
    <input type="checkbox" name="Language" id="eng" value="eng">English<br>
    <input type="checkbox" name="Language" id="beng" value="eng">Bengali<br>
    <input type="checkbox" name="Language" id="hindi" value="eng">Hindi<br>

    Upload file:<br>
    <input type="file" name="file" id="file" accept=".png, .pdf"> <br>

    Input month:
    <input type="month" name="month" id="month"><br>
    Week:<br>
    <input type="week" name="week" id="week"><br>
    Fav color:
    <input type="color" name="color" id="color"><br>
    Date time local:<br>
    <input type="datetime-local" name="dlocal" id="dlocal"><br>
    Hidden coloumn <br>
    <input

    <input type="reset" value="reset">
    

<br>
<input type="submit">
    </form>
</body>
</html>
